publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
overrides:
  normalize-package-data: ^9.0.0
minimumReleaseAgeExclude:
  - '@kitschpatrol/cspell-config@8.11.0'
  - '@kitschpatrol/eslint-config@8.11.0'
  - '@kitschpatrol/knip-config@8.11.0'
  - '@kitschpatrol/mdat-config@8.11.0'
  - '@kitschpatrol/prettier-config@8.11.0'
  - '@kitschpatrol/remark-config@8.11.0'
  - '@kitschpatrol/repo-config@8.11.0'
  - '@kitschpatrol/shared-config@8.11.0'
  - '@kitschpatrol/stylelint-config@8.11.0'
  - '@kitschpatrol/typescript-config@8.11.0'
  - '@pnpm/lockfile.fs@1100.2.12'
  - eslint-plugin-jsdoc@65.1.0
  - mdat@3.5.0
allowBuilds:
  unrs-resolver: true
